<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ec">
  <title>校园助手</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">校</span>
        <div>
          <p class="eyebrow">CAMPUS ASSISTANT</p>
          <h1 id="page-title">今天</h1>
        </div>
      </div>
      <button class="ghost-btn" id="refresh-btn" type="button">刷新</button>
    </header>

    <main>
      <!-- 首页：自签倒计时 + 最近截止 -->
      <section class="view" id="view-home" data-title="今天">
        <article class="card signing">
          <div class="row between">
            <span class="label">自签有效期</span>
            <span class="chip" id="signing-chip">读取中</span>
          </div>
          <p class="countdown" id="countdown">--</p>
          <p class="muted" id="expiry-line">正在读取签名信息…</p>
          <div class="meter"><span id="signing-meter"></span></div>
          <p class="tip" id="signing-tip"></p>
          <details class="steps">
            <summary>到期后怎么续签？</summary>
            <ol>
              <li>电脑打开 Sideloadly，iPhone 用数据线连电脑。</li>
              <li>把同一个 IPA 拖进 Sideloadly，输入 Apple ID 重新签名安装。</li>
              <li>覆盖安装即可，本机数据不会丢。免费账号 7 天后需要再续一次。</li>
            </ol>
          </details>
        </article>

        <div class="stat-row">
          <div class="card stat"><span>待办</span><strong id="stat-open">0</strong></div>
          <div class="card stat"><span>今天截止</span><strong id="stat-today">0</strong></div>
        </div>

        <section class="block">
          <div class="block-head">
            <h2>最近截止</h2>
            <button class="link-btn" id="go-reminders" type="button">全部</button>
          </div>
          <div class="list" id="upcoming-list"></div>
        </section>
      </section>

      <!-- 通知分析 -->
      <section class="view" id="view-analyze" data-title="通知分析" hidden>
        <article class="card">
          <label class="label" for="notice-text">粘贴学校通知</label>
          <textarea id="notice-text" rows="7" placeholder="把群通知、教务公告原文粘进来。带上时间、地点、材料等信息，分析会更准。"></textarea>
          <div class="row between">
            <span class="muted small" id="text-count">0 字</span>
            <button class="primary" id="analyze-btn" type="button">开始分析</button>
          </div>
        </article>

        <div id="analyze-result"></div>

        <section class="block">
          <div class="block-head"><h2>最近分析</h2></div>
          <div class="list" id="history-list"></div>
        </section>
      </section>

      <!-- 提醒事项 -->
      <section class="view" id="view-reminders" data-title="提醒事项" hidden>
        <div class="block-head">
          <p class="muted" id="reminder-summary">0 项待办</p>
          <button class="primary" id="add-reminder-btn" type="button">新增</button>
        </div>

        <form class="card form" id="reminder-form" hidden>
          <label>标题<input id="r-title" maxlength="80" required placeholder="例如：交物理实验报告"></label>
          <div class="grid2">
            <label>截止时间<input id="r-due" type="datetime-local"></label>
            <label>重要度
              <select id="r-priority">
                <option value="high">高</option>
                <option value="normal" selected>普通</option>
                <option value="low">低</option>
              </select>
            </label>
          </div>
          <label>备注<input id="r-note" maxlength="200" placeholder="选填"></label>
          <div class="row end">
            <button class="ghost-btn" id="r-cancel" type="button">取消</button>
            <button class="primary" type="submit">保存</button>
          </div>
        </form>

        <div class="list" id="reminder-list"></div>
      </section>

      <!-- 设置 -->
      <section class="view" id="view-settings" data-title="设置" hidden>
        <article class="card">
          <label class="label" for="access-key">DeepSeek API Key</label>
          <input id="access-key" type="password" autocomplete="off" placeholder="sk-...">
          <div class="row between">
            <span class="muted small">只保存在本机，不会上传到站点。</span>
            <button class="primary small" id="save-key" type="button">保存</button>
          </div>
        </article>

        <article class="card">
          <div class="row between">
            <span>通知权限</span>
            <strong id="notify-status">未知</strong>
          </div>
          <button class="ghost-btn" id="request-notify" type="button">开启通知</button>
        </article>

        <article class="card">
          <div class="row between"><span>签名到期</span><strong id="settings-expiry">未知</strong></div>
          <p class="muted small" id="settings-signing-source"></p>
        </article>

        <article class="card">
          <div class="row between"><span>界面版本</span><strong id="web-version">-</strong></div>
          <p class="muted small">界面和功能从服务器加载，发布新版本后打开即更新，不需要重新签名。</p>
          <div class="row">
            <button class="ghost-btn" id="reload-web" type="button">检查更新</button>
            <button class="danger-btn" id="clear-data" type="button">清空本机数据</button>
          </div>
        </article>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" data-view="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-6v-5h-4v5H4z"/></svg>
        <span>今天</span>
      </button>
      <button class="tab" data-view="analyze" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>
        <span>分析</span>
      </button>
      <button class="tab" data-view="reminders" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v2h4v16H5V5h4zM7 7v12h10V7zm2 4 1.6 1.6L14 9.2l1.4 1.4-4 4-3-3z"/></svg>
        <span>提醒</span>
      </button>
      <button class="tab" data-view="settings" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zm8.4 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8.7 8.7 0 0 0-1.9-1.1L15.8 3h-4l-.3 2.8c-.7.3-1.3.7-1.9 1.1l-2.4-1-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.3 2.8h4l.3-2.8c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4z"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
